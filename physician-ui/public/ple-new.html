<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — เริ่ม PLE ใหม่</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← กลับ</a></div></nav>
  <div class="container" style="max-width:560px">
    <header class="page-intro">
      <p class="eyebrow">PLE · New Session</p>
      <h1>เริ่ม PLE ใหม่</h1>
      <p class="sub">New Clinical Learning Episode — เริ่มบทสนทนากับผู้ช่วย AI เพื่อฝึกการให้เหตุผลทางคลินิก</p>
    </header>
    <div class="card">
      <div class="form-group">
        <label>สาขาวิชา / Specialty</label>
        <select id="specialty">
          <option value="">เลือกสาขา...</option>
          <option>Internal Medicine / อายุรศาสตร์</option>
          <option>Family Medicine / เวชศาสตร์ครอบครัว</option>
          <option>Surgery / ศัลยศาสตร์</option>
          <option>Pediatrics / กุมารเวชศาสตร์</option>
          <option>Emergency Medicine / เวชศาสตร์ฉุกเฉิน</option>
          <option>Obstetrics &amp; Gynecology / สูติ-นรีเวช</option>
          <option>Other / อื่น ๆ</option>
        </select>
      </div>
      <div class="form-group">
        <label>โฟลเดอร์ / Folder</label>
        <select id="folder">
          <option value="">— ไม่จัดหมวด / Uncategorized</option>
        </select>
      </div>
      <div class="form-group">
        <label>อาการสำคัญ / Chief Complaint <span style="color:var(--error)">*</span></label>
        <textarea id="complaint" rows="3" placeholder="เช่น ผู้ป่วยมาด้วยเจ็บหน้าอก / e.g. Patient presents with chest pain"></textarea>
      </div>
      <div id="error" class="error-msg" style="display:none"></div>
      <button class="btn btn-primary" id="startBtn" style="width:100%">เริ่มการสนทนา / Start Session</button>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/boot.js" defer></script>
  <script>
    // Pre-fill the folder picker (and honor ?folder=<id> deep links from the dashboard).
    (async () => {
      const sel = document.getElementById('folder');
      const folders = await api.getFolders().catch(() => []);
      const preset = new URLSearchParams(location.search).get('folder');
      for (const f of (folders || [])) {
        const o = document.createElement('option');
        o.value = f.id; o.textContent = f.name;
        if (preset && preset === f.id) o.selected = true;
        sel.appendChild(o);
      }
    })();

    document.getElementById('startBtn').addEventListener('click', async () => {
      const complaint = document.getElementById('complaint').value.trim();
      const specialty = document.getElementById('specialty').value;
      const folder_id = document.getElementById('folder').value || undefined;
      const errEl = document.getElementById('error');
      if (!complaint) { errEl.textContent = 'กรุณากรอกอาการสำคัญ'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      const btn = document.getElementById('startBtn');
      btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
      const ple = await api.createPle({ specialty, chief_complaint: complaint, folder_id });
      if (ple?.id) window.location.href = `/ple-chat?id=${ple.id}`;
      else {
        errEl.textContent = ple?.error ?? 'เกิดข้อผิดพลาด';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'เริ่มการสนทนา / Start Session';
      }
    });
  </script>
</body>
</html>
