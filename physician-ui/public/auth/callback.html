<!DOCTYPE html>
<html lang="th" data-public>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Browser chrome follows the OS; js/boot.js and the snippet below pin both to the chosen theme when the reader overrides it. -->
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
  <title>CLICS — เข้าสู่ระบบด้วย Google / Signing in</title>
  <!-- #183: the implicit flow returns the Google session in the URL hash. Lift it into memory and
       replace this history entry before supabase-js runs, so Back after Sign out cannot replay it. -->
  <script>(function(){try{var h=location.hash;if(h.length>1){window.CLICS_OAUTH_HASH=h.slice(1);history.replaceState(history.state,'',location.pathname+location.search);}}catch(e){}})();</script>
  <script>(function(){var d=document.documentElement,p,dk;try{p=localStorage.getItem('clics_theme')}catch(e){}if(p!=='light'&&p!=='dark')p='system';d.setAttribute('data-theme-pref',p);try{dk=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)d.setAttribute('data-theme','dark');if(p!=='system'){var m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',dk?'#181715':'#faf9f5');}var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { width:100%; max-width:440px; padding:24px 0; }
    .logo { text-align:center; margin-bottom:24px; }
    .logo h1 { font-size:30px; font-weight:600; color:var(--coral); font-family:var(--font-display); letter-spacing:-0.02em; }
    .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
    @media (prefers-reduced-motion: no-preference) { .logo { animation: clics-rise .6s ease both; } }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>CLICS</h1>
      <svg class="logo-ecg" viewBox="0 0 220 40" width="160" height="29" fill="none" aria-hidden="true" focusable="false">
        <path class="ecg-line" pathLength="100" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M2 28 H58 C62 28 63 23.5 66 23.5 C69 23.5 70 28 74 28 H84 L89 34 L96 6 L102 33 L106 28 H118 C122 28 124 20.5 128 20.5 C132 20.5 134 28 138 28 H218"/>
      </svg>
      <p>เข้าสู่ระบบด้วย Google · Google sign-in</p>
    </div>

    <!-- Working -->
    <div class="card" id="loadingCard">
      <p style="font-size:14px; color:var(--muted); text-align:center" id="loadingMsg">กำลังเข้าสู่ระบบ... / Completing sign-in...</p>
    </div>

    <!-- First-time council pick -->
    <div class="card" id="councilCard" style="display:none">
      <p style="font-size:14px; color:var(--muted); margin-bottom:16px; line-height:1.55">
        เลือกสภาวิชาชีพของคุณเพื่อสร้างบัญชี<br/>Pick your professional council to finish creating your account.
      </p>
      <div class="form-group">
        <label for="council">สภาวิชาชีพ / Professional council</label>
        <select id="council"><option value="">— เลือกสภา / Select a council —</option></select>
      </div>
      <div class="form-group" id="trainingLevelGroup" style="display:none">
        <label for="trainingLevel">ระดับการฝึกอบรมสูงสุด / Highest medical training level</label>
        <select id="trainingLevel">
          <option value="">— เลือกระดับ / Select a level —</option>
          <option value="extern">เอกซ์เทิร์น / Extern</option>
          <option value="intern">แพทย์อินเทิร์น / Intern</option>
          <option value="resident">แพทย์ประจำบ้าน / Resident</option>
          <option value="fellowship">แพทย์ประจำบ้านต่อยอด / Fellow</option>
          <option value="staff">อาจารย์แพทย์ / Staff</option>
        </select>
      </div>
      <div class="form-group" id="specialtyGroup" style="display:none">
        <label for="specialty">ความเชี่ยวชาญ / Specialty</label>
        <input type="text" id="specialtySearch" placeholder="ค้นหาความเชี่ยวชาญ / Search specialty…" autocomplete="off" style="margin-bottom:6px" />
        <select id="specialty" size="6"><option value="">— เลือกความเชี่ยวชาญ / Select a specialty —</option></select>
      </div>
      <div id="councilErr" class="error-msg" role="alert" aria-live="assertive" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="councilBtn">ดำเนินการต่อ / Continue</button>
    </div>

    <!-- Error -->
    <div class="card" id="errorCard" style="display:none">
      <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive" style="display:block; font-size:14px; line-height:1.55"></div>
      <a href="/login" class="btn btn-primary" style="width:100%;margin-top:16px">ไปหน้าเข้าสู่ระบบ / Go to login →</a>
    </div>

    <!-- Done (invite pending review) -->
    <div class="card" id="doneCard" style="display:none">
      <div class="auth-success" id="doneMsg"></div>
      <a href="/login" id="doneCta" class="btn btn-primary" style="width:100%;margin-top:16px">ไปหน้าเข้าสู่ระบบ / Go to login →</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/supabase-client.js"></script>
  <script src="/js/oauth-callback.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
