<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — CLE</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/cle-result" />
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Sanitizer for AI markdown→HTML (marked has no built-in sanitizer) — prevents DOM-XSS via AI output. -->
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container chat-page">
    <!-- Slim Claude-style header: one strip so the conversation below is the hero. -->
    <div class="chat-head">
      <div class="ch-left">
        <span class="ch-cle" id="cleEyebrow">CLE</span>
        <span class="ch-title" id="chatTitle">บทสนทนาคลินิก</span>
        <span class="ch-metric" data-icon="clock" title="เวลาใช้งานจริง — นับเฉพาะตอนพิมพ์และ AI ตอบ ไม่นับตอนพักหน้าจอ / Active time only"><span id="timer">00:00</span></span>
        <span class="ch-metric" data-icon="message"><span id="turns">0</span> รอบ</span>
      </div>
      <div class="ch-right">
        <!-- AI allowance chip — rendered by js/usage.js, refreshed after each turn -->
        <span id="usageBar"></span>
        <!-- Session progress toward the minimums; opens as a dropdown (Socratic mode stays hidden). -->
        <details class="session-progress" id="sessionProgress" hidden>
          <summary class="ch-prog" title="ความคืบหน้าของเซสชัน / Session progress"><span data-icon="hourglass" data-icon-size="16"></span></summary>
          <div class="sp-pop">
            <div class="sp-grid">
              <div class="sp-meter" id="spTime"><div class="sp-head"><span>เวลา<span class="bi-en">Time</span></span><b><span id="spTimeNow">0</span>/15 น.</b></div><div class="sp-track"><div class="sp-fill" id="spTimeFill"></div></div></div>
              <div class="sp-meter" id="spTurns"><div class="sp-head"><span>รอบสนทนา<span class="bi-en">Turns</span></span><b><span id="spTurnsNow">0</span>/4</b></div><div class="sp-track"><div class="sp-fill" id="spTurnsFill"></div></div></div>
              <div class="sp-meter" id="spDepth"><div class="sp-head"><span>เนื้อหา<span class="bi-en">Depth</span></span><b id="spDepthState">—</b></div><div class="sp-track"><div class="sp-fill" id="spDepthFill"></div></div></div>
            </div>
          </div>
        </details>
        <a href="/dashboard" class="btn btn-ghost btn-sm" data-icon="pause" id="pauseBtn" title="กลับหน้าหลักโดยไม่จบ session — กลับมาทำต่อได้ / Pause (autosaves)">พักไว้<span class="bi-en">Pause</span></a>
        <button class="btn btn-finish btn-sm" data-icon="check" id="endBtn" title="ส่งให้ประเมินคะแนน — ทำต่อไม่ได้ / Submit for scoring (can't resume)">จบและส่ง<span class="bi-en">End</span></button>
      </div>
    </div>
    <div class="chat-window card" style="padding:0">
      <div class="chat-messages" id="messages" style="padding:16px"></div>
      <button class="scroll-bottom" id="scrollBottomBtn" data-icon="arrowDown" aria-label="เลื่อนไปข้อความล่าสุด / Scroll to latest"></button>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="พิมพ์คำถามเกี่ยวกับเคส... / Type your clinical question..."></textarea>
          <button class="composer-send" id="sendBtn" data-icon="arrowUp" data-icon-size="20" aria-label="ส่ง / Send"></button>
        </div>
        <p class="composer-hint">Enter ส่ง · Shift+Enter ขึ้นบรรทัด<span class="bi-en">Enter to send · Shift+Enter for new line</span></p>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/usage.js"></script>
  <script src="/js/cle-chat.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
