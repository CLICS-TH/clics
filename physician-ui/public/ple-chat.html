<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — PLE</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/ple-result" />
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Sanitizer for AI markdown→HTML (marked has no built-in sanitizer) — prevents DOM-XSS via AI output. -->
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container">
    <header class="page-intro">
      <p class="eyebrow">PLE · Clinical Dialogue</p>
      <h1 id="chatTitle">บทสนทนาคลินิก</h1>
      <p class="sub">ถาม–ตอบกับผู้ช่วย AI · ทุกคำตอบมีการอ้างอิงและคำถามชวนคิด (Socratic)</p>
    </header>
    <div class="session-bar">
      <div title="เวลาใช้งานจริง — นับเฉพาะตอนพิมพ์และ AI ตอบ ไม่นับตอนพักหน้าจอ / Active time only">⏱ <span id="timer">00:00</span></div>
      <div>💬 <span id="turns">0</span> รอบ</div>
      <div>📝 <span id="tokens">0</span> tokens</div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <a href="/dashboard" class="btn btn-ghost" id="pauseBtn" title="กลับหน้าหลักโดยไม่จบ session — กลับมาทำต่อได้">⏸ พักไว้ / Pause</a>
        <button class="btn btn-danger" id="endBtn">จบ Session / End</button>
      </div>
    </div>
    <p style="font-size:11px;color:var(--muted-soft);margin:-6px 0 12px">⏸ พักไว้ = บันทึกอัตโนมัติและกลับมาทำต่อภายหลังได้ · จบ Session = ส่งประเมินคะแนน</p>
    <div class="chat-window card" style="padding:0">
      <div class="chat-messages" id="messages" style="padding:16px"></div>
      <div style="padding:12px 16px;border-top:1px solid var(--hairline)">
        <div class="chat-input-row">
          <textarea id="input" rows="2" placeholder="พิมพ์คำถามเกี่ยวกับเคส... / Type your clinical question..."></textarea>
          <button class="btn btn-primary" id="sendBtn">ส่ง&nbsp;➤</button>
        </div>
        <p style="font-size:11px;color:var(--muted-soft);margin-top:6px">Shift+Enter ขึ้นบรรทัดใหม่ · Enter ส่ง</p>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ple-chat.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
