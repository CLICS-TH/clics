<!DOCTYPE html>
<html lang="th" data-public>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — ขอเข้าใช้งาน / Request Access</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { width:100%; max-width:460px; padding:24px 0; }
    .logo { text-align:center; margin-bottom:24px; }
    .logo h1 { font-size:30px; font-weight:600; color:var(--coral); font-family:var(--font-display); letter-spacing:-0.02em; }
    .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
    @media (prefers-reduced-motion: no-preference) { .logo { animation: clics-rise .6s ease both; } }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>CLICS</h1>
      <p>ขอเข้าใช้งาน · Request Access</p>
      <p class="role-tagline">บัญชีจะอยู่ในสถานะ “รอการอนุมัติ” จนกว่าผู้ดูแลจะอนุมัติเข้าสู่บทบาท<br/>Your account stays pending until an administrator approves it into a role.</p>
    </div>

    <!-- Success state (shown after a request is submitted) -->
    <div class="card" id="successCard" style="display:none">
      <div class="auth-success" id="successMsg"></div>
      <a href="/" class="btn btn-ghost" style="width:100%;margin-top:16px">← กลับหน้าเข้าสู่ระบบ / Back to login</a>
    </div>

    <!-- Email request form -->
    <div class="card" id="emailCard">
      <div class="form-group">
        <label for="th">ชื่อ–สกุล (ไทย) / Full name (Thai)</label>
        <input type="text" id="th" placeholder="นพ. สมชาย ใจดี" />
      </div>
      <div class="form-group">
        <label for="en">ชื่อ–สกุล (อังกฤษ) / Full name (English)</label>
        <input type="text" id="en" placeholder="Dr Somchai Jaidee" />
      </div>
      <div class="form-group">
        <label for="email">อีเมล / Email</label>
        <input type="email" id="email" placeholder="doctor@hospital.th" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">ตั้งรหัสผ่าน / Set password (≥ 8)</label>
        <input type="password" id="password" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="specialty">สาขา (ถ้ามี) / Specialty (optional)</label>
        <input type="text" id="specialty" placeholder="Internal Medicine" />
      </div>
      <div id="emailErr" class="error-msg" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="submitBtn">ส่งคำขอ / Submit request</button>
      <p class="auth-links"><a href="/">← กลับเข้าสู่ระบบ / Back to login</a></p>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/request-access.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
