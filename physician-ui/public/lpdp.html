<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — ความก้าวหน้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container" style="max-width:700px">
    <h2 style="margin-bottom:20px">ความก้าวหน้าของคุณ / Your LPDP</h2>
    <div class="card"><canvas id="lpdpChart" height="220"></canvas></div>
    <p id="noData" style="display:none;color:#94a3b8;text-align:center;padding:20px">ยังไม่มีข้อมูล — กรุณาทำ PLE ให้ผ่านก่อน</p>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    auth.guardPage();
    const user = auth.getUser();
    fetch(`${window.CLICS_API_URL || 'http://localhost:3001'}/admin/lpdp/${user.id}`, {
      headers: { Authorization: `Bearer ${localStorage.getItem('clics_token')}` }
    })
    .then(r => { if (!r.ok) { if (r.status === 401) { localStorage.clear(); window.location.href = '/'; } throw new Error('Failed'); } return r.json(); })
    .then(data => {
      if (!data?.length) { document.getElementById('noData').style.display = 'block'; return; }
      new Chart(document.getElementById('lpdpChart'), {
        type: 'line',
        data: {
          labels: data.map((_, i) => `PLE ${i + 1}`),
          datasets: [{ label: 'คะแนน PIS-7', data: data.map(d => d.composite_score), borderColor: '#cc785c', backgroundColor: 'rgba(204,120,92,0.10)', tension: 0.3, pointRadius: 5, pointBackgroundColor: '#cc785c' }],
        },
        options: {
          scales: { y: { min: 0, max: 100, title: { display: true, text: 'คะแนน / 100' } } },
          plugins: { legend: { display: false } },
        },
      });
    })
    .catch(() => { document.getElementById('noData').style.display = 'block'; });
  </script>
</body>
</html>
