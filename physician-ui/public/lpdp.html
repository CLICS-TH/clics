<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — ความก้าวหน้า</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/dashboard" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container" style="max-width:700px">
    <header class="page-intro">
      <p class="eyebrow">LPDP · Progress</p>
      <h1>ความก้าวหน้าของคุณ</h1>
      <p class="sub">Longitudinal Personal Development Profile — เส้นทางคะแนน PIS-7 ของคุณตลอดการเรียนรู้</p>
    </header>
    <div id="lpdpSummary" class="lpdp-summary" style="display:none"></div>
    <div class="card"><canvas id="lpdpChart" height="220"></canvas></div>
    <p id="noData" style="display:none;color:var(--muted);text-align:center;padding:20px">ยังไม่มีข้อมูล — กรุณาทำ CLE ให้ผ่านก่อน / No progress yet — pass a CLE first.</p>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/labels.js"></script>
  <script src="/js/boot.js" defer></script>
  <script>
    // cssVar comes from /js/labels.js
    let lpdpChart = null, lpdpData = null;
    function buildLine() {
      if (!lpdpData || !lpdpData.length || typeof Chart === 'undefined') return;
      const el = document.getElementById('lpdpChart');
      if (!el) return;
      if (lpdpChart) lpdpChart.destroy();
      const coral = cssVar('--coral'), grid = cssVar('--hairline'), text = cssVar('--muted');
      lpdpChart = new Chart(el, {
        type: 'line',
        data: {
          // Date the timeline so it's meaningful — not anonymous "CLE 1, CLE 2…".
          labels: lpdpData.map(d => d.snapshot_at ? new Date(d.snapshot_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : ''),
          datasets: [{ label: 'คะแนน PIS-7', data: lpdpData.map(d => d.composite_score), borderColor: coral, backgroundColor: coral + '1a', tension: 0.3, pointRadius: 5, pointBackgroundColor: coral }],
        },
        options: {
          scales: {
            y: { min: 0, max: 100, title: { display: true, text: 'คะแนน / 100', color: text }, ticks: { color: text }, grid: { color: grid } },
            x: { ticks: { color: text }, grid: { color: grid } },
          },
          plugins: { legend: { display: false } },
        },
      });
    }
    window.addEventListener('clics:themechange', buildLine);
    // Frame the lonely chart: lead with the latest score + how it moved, so progress feels personal.
    function renderSummary(data) {
      const host = document.getElementById('lpdpSummary');
      const latest = Math.round(data[data.length - 1].composite_score);
      const prev = data.length > 1 ? data[data.length - 2].composite_score : null;
      const delta = prev != null ? Math.round(latest - prev) : null;
      let trend;
      if (delta == null) trend = '<span class="lpdp-trend">CLE แรกของคุณ<span class="bi-en">Your first episode</span></span>';
      else if (delta >= 0) trend = `<span class="lpdp-trend is-up">▲ +${delta} <span style="opacity:.75">จากครั้งก่อน / vs last</span></span>`;
      else trend = `<span class="lpdp-trend is-down">▼ ${delta} <span style="opacity:.75">จากครั้งก่อน / vs last</span></span>`;
      host.innerHTML = `
        <div><p class="lpdp-latest">${latest}</p><p class="lpdp-latest-cap">คะแนนล่าสุด / Latest · ${data.length} CLE</p></div>
        <div>${trend}</div>`;
      host.style.display = 'flex';
    }
    // Empty state: hide the (otherwise blank, broken-looking) chart card and show only the notice.
    function showEmpty() {
      const card = document.querySelector('.card');
      if (card) card.style.display = 'none';
      document.getElementById('noData').style.display = 'block';
    }
    // A FETCH FAILURE is not "no data yet" — don't tell a physician with evaluated CLEs to "go pass a
    // CLE." Show a distinct, retryable error instead.
    function showError() {
      const card = document.querySelector('.card');
      if (card) card.style.display = 'none';
      const nd = document.getElementById('noData');
      nd.textContent = 'โหลดข้อมูลความก้าวหน้าไม่สำเร็จ กรุณารีเฟรช / Could not load your progress. Please refresh.';
      nd.style.display = 'block';
    }
    function loadLpdp() {
      fetch(`${window.CLICS_API_URL || 'http://localhost:3001'}/cles/lpdp/me`, {
        headers: { Authorization: `Bearer ${localStorage.getItem('clics_token')}` }
      })
      .then(r => {
        if (r.status === 401) {
          // Preserve display prefs across the forced re-login (mirror js/api.js) — only the session dies.
          const theme = localStorage.getItem('clics_theme'), view = localStorage.getItem('clics_view');
          localStorage.clear();
          if (theme) localStorage.setItem('clics_theme', theme);
          if (view) localStorage.setItem('clics_view', view);
          window.location.href = '/';
          throw new Error('auth');
        }
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(data => {
        if (!data?.length) { showEmpty(); return; }
        lpdpData = data;
        renderSummary(data);
        buildLine();
      })
      .catch((e) => { if (e && e.message === 'auth') return; showError(); });
    }
    window.addEventListener('DOMContentLoaded', loadLpdp);
  </script>
</body>
</html>
