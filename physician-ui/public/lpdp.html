<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — ความก้าวหน้า</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/dashboard" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container" style="max-width:700px">
    <h2 style="margin-bottom:20px">ความก้าวหน้าของคุณ / Your LPDP</h2>
    <div class="card"><canvas id="lpdpChart" height="220"></canvas></div>
    <p id="noData" style="display:none;color:var(--muted-soft);text-align:center;padding:20px">ยังไม่มีข้อมูล — กรุณาทำ PLE ให้ผ่านก่อน</p>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/boot.js" defer></script>
  <script>
    function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
    let lpdpChart = null, lpdpData = null;
    function buildLine() {
      if (!lpdpData || !lpdpData.length || typeof Chart === 'undefined') return;
      const el = document.getElementById('lpdpChart');
      if (!el) return;
      if (lpdpChart) lpdpChart.destroy();
      const coral = cssVar('--coral'), grid = cssVar('--hairline'), text = cssVar('--muted');
      lpdpChart = new Chart(el, {
        type: 'line',
        data: {
          labels: lpdpData.map((_, i) => `PLE ${i + 1}`),
          datasets: [{ label: 'คะแนน PIS-7', data: lpdpData.map(d => d.composite_score), borderColor: coral, backgroundColor: coral + '1a', tension: 0.3, pointRadius: 5, pointBackgroundColor: coral }],
        },
        options: {
          scales: {
            y: { min: 0, max: 100, title: { display: true, text: 'คะแนน / 100', color: text }, ticks: { color: text }, grid: { color: grid } },
            x: { ticks: { color: text }, grid: { color: grid } },
          },
          plugins: { legend: { display: false } },
        },
      });
    }
    window.addEventListener('clics:themechange', buildLine);
    function loadLpdp() {
      fetch(`${window.CLICS_API_URL || 'http://localhost:3001'}/ples/lpdp/me`, {
        headers: { Authorization: `Bearer ${localStorage.getItem('clics_token')}` }
      })
      .then(r => { if (!r.ok) { if (r.status === 401) { localStorage.clear(); window.location.href = '/'; } throw new Error('Failed'); } return r.json(); })
      .then(data => {
        if (!data?.length) { document.getElementById('noData').style.display = 'block'; return; }
        lpdpData = data;
        buildLine();
      })
      .catch(() => { document.getElementById('noData').style.display = 'block'; });
    }
    window.addEventListener('DOMContentLoaded', loadLpdp);
  </script>
</body>
</html>
