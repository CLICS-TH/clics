<!DOCTYPE html>
<html lang="th" data-public>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — รับคำเชิญ / Accept invite</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { width:100%; max-width:460px; padding:24px 0; }
    .logo { text-align:center; margin-bottom:24px; }
    .logo h1 { font-size:30px; font-weight:600; color:var(--coral); font-family:var(--font-display); letter-spacing:-0.02em; }
    .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
    @media (prefers-reduced-motion: no-preference) { .logo { animation: clics-rise .6s ease both; } }
    .invite-meta { background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md); padding:12px 16px; font-size:13px; color:var(--muted); margin-bottom:18px; line-height:1.7; }
    .invite-meta strong { color:var(--ink); }
    .otp-input { letter-spacing:0.5em; text-align:center; font-family:var(--font-mono); font-size:20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>CLICS</h1>
      <p>รับคำเชิญเข้าร่วม · Accept your invitation</p>
    </div>

    <!-- Loading -->
    <div class="card" id="loadingCard">
      <p style="font-size:14px; color:var(--muted); text-align:center">กำลังตรวจสอบคำเชิญ... / Checking your invite...</p>
    </div>

    <!-- Invalid / expired -->
    <div class="card" id="invalidCard" style="display:none">
      <div class="error-msg" id="invalidMsg" style="display:block; font-size:14px; line-height:1.55"></div>
      <a href="/" class="btn btn-primary" style="width:100%;margin-top:16px">ไปหน้าเข้าสู่ระบบ / Go to login →</a>
    </div>

    <!-- Choose method -->
    <div class="card" id="acceptCard" style="display:none">
      <div class="invite-meta" id="inviteMeta"></div>

      <!-- Google option (only shown when OAUTH is available) -->
      <div class="auth-oauth" id="googleWrap" style="display:none">
        <button class="btn btn-ghost" id="googleBtn"><span class="oauth-mark">G</span> ดำเนินการต่อด้วย Google / Continue with Google</button>
        <div class="auth-divider">หรือ / or</div>
      </div>

      <!-- Password option -->
      <div class="form-group">
        <label for="th">ชื่อ–สกุล (ไทย) / Full name (Thai)</label>
        <input type="text" id="th" placeholder="นพ. สมชาย ใจดี" />
      </div>
      <div class="form-group">
        <label for="en">ชื่อ–สกุล (อังกฤษ) / Full name (English)</label>
        <input type="text" id="en" placeholder="Dr Somchai Jaidee" />
      </div>
      <div class="form-group">
        <label for="password">ตั้งรหัสผ่าน / Set password (≥ 10, ตัวอักษร+ตัวเลข)</label>
        <input type="password" id="password" autocomplete="new-password" />
      </div>
      <div id="acceptErr" class="error-msg" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="passwordBtn">ตั้งรหัสผ่านและส่งรหัส / Set password &amp; send code</button>
    </div>

    <!-- OTP step (password method) -->
    <div class="card" id="otpCard" style="display:none">
      <p style="font-size:14px; color:var(--muted); margin-bottom:16px; line-height:1.55">
        เราได้ส่งรหัส 6 หลักไปที่ <strong id="otpEmail"></strong><br/>
        We sent a 6-digit code to that email. Enter it to finish.
      </p>
      <div class="form-group">
        <label for="otp">รหัส 6 หลัก / 6-digit code</label>
        <input type="text" id="otp" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
      </div>
      <div id="otpErr" class="error-msg" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="verifyBtn">ยืนยันและเข้าร่วม / Verify &amp; join</button>
    </div>

    <!-- Done -->
    <div class="card" id="doneCard" style="display:none">
      <div class="auth-success" id="doneMsg"></div>
      <a href="#" id="doneCta" class="btn btn-primary" style="width:100%;margin-top:16px"></a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/supabase-client.js"></script>
  <script src="/js/invite.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
