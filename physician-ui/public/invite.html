<!DOCTYPE html>
<html lang="th" data-public>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Browser chrome follows the OS; js/boot.js and the snippet below pin both to the chosen theme when the reader overrides it. -->
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
  <title>CLICS — รับคำเชิญ / Accept invite</title>
  <script>(function(){var d=document.documentElement,p,dk;try{p=localStorage.getItem('clics_theme')}catch(e){}if(p!=='light'&&p!=='dark')p='system';d.setAttribute('data-theme-pref',p);try{dk=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)d.setAttribute('data-theme','dark');if(p!=='system'){var m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',dk?'#181715':'#faf9f5');}var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(v==='mobile'||(v!=='desktop'&&matchMedia('(max-width:767px)').matches))d.setAttribute('data-mobile','');}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { width:100%; max-width:460px; padding:24px 0; }
    .logo { text-align:center; margin-bottom:24px; }
    .logo h1 { font-size:30px; font-weight:600; color:var(--coral); font-family:var(--font-display); letter-spacing:-0.02em; }
    .logo p { color:var(--muted); font-size:13px; margin-top:4px; }
    @media (prefers-reduced-motion: no-preference) { .logo { animation: clics-rise .6s ease both; } }
    .invite-meta { background:var(--surface-soft); border:1px solid var(--hairline); border-radius:var(--r-md); padding:12px 16px; font-size:13px; color:var(--muted); margin-bottom:18px; line-height:1.7; }
    .invite-meta strong { color:var(--ink); }
    .otp-input { letter-spacing:0.5em; text-align:center; font-family:var(--font-mono); font-size:20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>CLICS</h1>
      <svg class="logo-ecg" viewBox="0 0 220 40" width="160" height="29" fill="none" aria-hidden="true" focusable="false">
        <path class="ecg-line" pathLength="100" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M2 28 H58 C62 28 63 23.5 66 23.5 C69 23.5 70 28 74 28 H84 L89 34 L96 6 L102 33 L106 28 H118 C122 28 124 20.5 128 20.5 C132 20.5 134 28 138 28 H218"/>
      </svg>
      <p>รับคำเชิญเข้าร่วม · Accept your invitation</p>
    </div>

    <!-- Loading -->
    <div class="card" id="loadingCard">
      <p style="font-size:14px; color:var(--muted); text-align:center">กำลังตรวจสอบคำเชิญ... / Checking your invite...</p>
    </div>

    <!-- Invalid / expired -->
    <div class="card" id="invalidCard" style="display:none">
      <div class="error-msg" id="invalidMsg" role="alert" aria-live="assertive" style="display:block; font-size:14px; line-height:1.55"></div>
      <a href="/login" class="btn btn-primary" style="width:100%;margin-top:16px">ไปหน้าเข้าสู่ระบบ / Go to login →</a>
    </div>

    <!-- Choose method -->
    <div class="card" id="acceptCard" style="display:none">
      <div class="invite-meta" id="inviteMeta"></div>

      <!-- Google option (only shown when OAUTH is available) -->
      <div class="auth-oauth" id="googleWrap" style="display:none">
        <button class="btn btn-ghost" id="googleBtn"><svg class="oauth-g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> ดำเนินการต่อด้วย Google / Continue with Google</button>
        <div class="auth-divider">หรือ / or</div>
      </div>

      <!-- Password option -->
      <div class="form-group">
        <label for="th">ชื่อ–สกุล (ไทย) / Full name (Thai)</label>
        <input type="text" id="th" placeholder="นพ. สมชาย ใจดี" />
      </div>
      <div class="form-group">
        <label for="en">ชื่อ–สกุล (อังกฤษ) / Full name (English)</label>
        <input type="text" id="en" placeholder="Dr Somchai Jaidee" />
      </div>
      <div class="form-group">
        <label for="password">ตั้งรหัสผ่าน / Set password (≥ 10, ตัวอักษร+ตัวเลข)</label>
        <div style="position:relative">
          <input type="password" id="password" autocomplete="new-password" style="padding-right:44px" />
          <button type="button" class="pw-toggle" aria-label="แสดงรหัสผ่าน / Show password" onclick="var i=document.getElementById('password');var s=i.type==='password';i.type=s?'text':'password';this.classList.toggle('pw-on',s)"><svg class="pw-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="pw-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg></button>
        </div>
      </div>
      <div id="acceptErr" class="error-msg" role="alert" aria-live="assertive" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="passwordBtn">ตั้งรหัสผ่านและส่งรหัส / Set password &amp; send code</button>
    </div>

    <!-- OTP step (password method) -->
    <div class="card" id="otpCard" style="display:none">
      <p style="font-size:14px; color:var(--muted); margin-bottom:16px; line-height:1.55">
        เราได้ส่งรหัส 6 หลักไปที่ <strong id="otpEmail"></strong><br/>
        We sent a 6-digit code to that email. Enter it to finish.
      </p>
      <div class="form-group">
        <label for="otp">รหัส 6 หลัก / 6-digit code</label>
        <input type="text" id="otp" class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
      </div>
      <div id="otpErr" class="error-msg" role="alert" aria-live="assertive" style="display:none"></div>
      <button class="btn btn-primary" style="width:100%" id="verifyBtn">ยืนยันและเข้าร่วม / Verify &amp; join</button>
    </div>

    <!-- Done -->
    <div class="card" id="doneCard" style="display:none">
      <div class="auth-success" id="doneMsg"></div>
      <a href="#" id="doneCta" class="btn btn-primary" style="width:100%;margin-top:16px"></a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/supabase-client.js"></script>
  <script src="/js/invite.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
