<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — Dashboard</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/ple-new" />
</head>
<body>
  <nav>
    <span class="brand">CLICS</span>
    <div>
      <a href="/dashboard">หน้าหลัก / Home</a>
      <a href="/lpdp">ความก้าวหน้า / Progress</a>
      <a href="#" id="logoutBtn">ออกจากระบบ / Logout</a>
    </div>
  </nav>
  <div class="container">
    <header class="page-intro">
      <p class="eyebrow">แดชบอร์ด · Dashboard</p>
      <div class="page-intro-row">
        <h1 id="greeting"></h1>
        <span class="role-badge">แพทย์อาสา / Physician</span>
      </div>
      <p class="sub">Clinical Learning Episodes ของคุณ — จัดระเบียบด้วยโฟลเดอร์ / Organize your episodes in folders</p>
    </header>

    <div class="dash-toolbar">
      <button class="btn btn-ghost" id="newFolderBtn" type="button">+ โฟลเดอร์ใหม่ / New folder</button>
      <a href="/ple-new" class="btn btn-primary">+ เริ่ม PLE ใหม่ / New PLE</a>
    </div>
    <form class="folder-form" id="newFolderForm" hidden>
      <input id="newFolderName" type="text" maxlength="80" placeholder="ชื่อโฟลเดอร์ / Folder name…" autocomplete="off" />
      <button class="btn btn-primary" id="createFolderBtn" type="submit">สร้าง / Create</button>
      <button class="btn btn-ghost" id="cancelFolderBtn" type="button">ยกเลิก / Cancel</button>
    </form>

    <div id="pleList"><p class="list-empty">กำลังโหลด...</p></div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/boot.js" defer></script>
</body>
</html>
