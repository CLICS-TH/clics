<!DOCTYPE html>
<html lang="th" data-public>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)" />
  <title>CLICS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Sign-in lives at /login. These two scripts must survive any future landing page at /:
       deployed dashboards sign out via /?logout=1, and Supabase returns OAuth to its Site URL (this
       root) when the redirect is not allow-listed. See docs/adr/0003-portal-root-keeps-auth-rescue.md. -->
  <script>(function(){try{if(location.search.indexOf('logout=1')!==-1){var t=localStorage.getItem('clics_theme'),v=localStorage.getItem('clics_view');localStorage.clear();sessionStorage.clear();if(t)localStorage.setItem('clics_theme',t);if(v)localStorage.setItem('clics_view',v);if(history.replaceState)history.replaceState(null,'',location.pathname);}}catch(e){}})();</script>
  <script>(function(){try{var h=location.hash,s=location.search;if(h.indexOf('access_token')!==-1||h.indexOf('error_description')!==-1||s.indexOf('code=')!==-1){location.replace('/auth/callback'+s+h);return;}}catch(e){}location.replace('/login');})();</script>
  <script>(function(){var d=document.documentElement,p,dk;try{p=localStorage.getItem('clics_theme')}catch(e){}if(p!=='light'&&p!=='dark')p='system';d.setAttribute('data-theme-pref',p);try{dk=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)d.setAttribute('data-theme','dark');if(p!=='system'){var m=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<m.length;i++)m[i].setAttribute('content',dk?'#181715':'#faf9f5');}var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(v==='mobile'||(v!=='desktop'&&matchMedia('(max-width:767px)').matches))d.setAttribute('data-mobile','');if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <noscript><meta http-equiv="refresh" content="0;url=/login" /></noscript>
</head>
<body></body>
</html>
