<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLICS — ผลการประเมิน</title>
  <script>(function(){var d=document.documentElement;try{if(localStorage.getItem('clics_theme')==='dark')d.setAttribute('data-theme','dark');var v=localStorage.getItem('clics_view');if(v==='mobile'||v==='desktop')d.setAttribute('data-view',v);if(!d.hasAttribute('data-public')&&!localStorage.getItem('clics_token'))location.replace('/');}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Thai:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="prefetch" href="/dashboard" />
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav><span class="brand">CLICS</span><div><a href="/dashboard">← Dashboard</a></div></nav>
  <div class="container" style="max-width:640px">
    <header class="page-intro">
      <p class="eyebrow">PLE · Evaluation</p>
      <h1>ผลการประเมิน PIS-7</h1>
      <p class="sub">PIS-7 Evaluation — สรุปผลการให้เหตุผลทางคลินิกและเครดิต CPD ของ Episode นี้</p>
    </header>
    <div id="content"><p style="text-align:center;padding:40px;color:var(--muted-soft)">กำลังโหลด...</p></div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/labels.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/boot.js" defer></script>
  <script>
    const pleId = new URLSearchParams(location.search).get('id');
    let radarChart = null, lastScores = null;
    // Auto-poll while the evaluation is still running, instead of asking the user to hit "Refresh"
    // (the system should do its own polling). Bounded so it can't spin forever.
    let pollTimer = null, pollCount = 0;
    function schedulePoll() {
      clearTimeout(pollTimer);
      if (pollCount++ >= 45) return; // ~3 min ceiling
      pollTimer = setTimeout(load, 4000);
    }
    function buildRadar() {
      if (!lastScores || typeof Chart === 'undefined') return;
      const el = document.getElementById('radarChart');
      if (!el) return;
      if (radarChart) radarChart.destroy();
      const coral = cssVar('--coral'), grid = cssVar('--hairline'), text = cssVar('--muted');
      radarChart = new Chart(el, {
        type: 'radar',
        data: {
          labels: DOMAIN_LABELS.map(l => l.split(' ').slice(0,2).join(' ')),
          datasets: [{ label: 'PIS-7 Score', data: lastScores, backgroundColor: coral + '26', borderColor: coral, pointBackgroundColor: coral }],
        },
        options: { scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, color: text, backdropColor: 'transparent' }, grid: { color: grid }, angleLines: { color: grid }, pointLabels: { color: text } } }, plugins: { legend: { display: false } } },
      });
    }
    window.addEventListener('clics:themechange', buildRadar);
    // DOMAIN_LABELS / CRITERIA_LABELS come from /js/labels.js

    function showMissing(container) {
      container.innerHTML = `
        <div class="card" style="text-align:center">
          <div class="status-band is-review" style="justify-content:center;margin-bottom:14px">${icon('warn', 28)}</div>
          <h2>ไม่พบ Episode นี้ / Episode not found</h2>
          <p style="color:var(--muted);margin-top:8px">อาจถูกลบไปแล้ว หรือลิงก์ไม่ถูกต้อง / It may have been deleted, or the link is invalid.</p>
          <a href="/dashboard" class="btn btn-ghost" style="display:inline-block;margin-top:16px">← กลับแดชบอร์ด / Back to dashboard</a>
        </div>`;
    }

    async function load() {
      const ple = await api.getPle(pleId);
      const container = document.getElementById('content');
      // Unknown/deleted id (or network failure) → { error } with no status; don't fall
      // through to the scorecard, which would render NaN everywhere.
      if (!ple || ple.error || !ple.status) { showMissing(container); return; }
      if (ple.status === 'active') { container.innerHTML = '<p>กรุณาจบ session ก่อน</p>'; return; }

      if (ple.status === 'cle_fail_t1' || ple.status === 'cle_flag_t2') {
        const criteria = ['c1','c2','c3','c4','c5','c6'];
        const isFail = ple.status === 'cle_fail_t1';
        container.innerHTML = `
          <div class="card">
            <div class="status-band ${isFail ? 'is-fail' : 'is-review'}" style="margin-bottom:16px">
              ${icon(isFail ? 'xCircle' : 'hourglass', 28)}
              <span>${isFail ? 'ไม่ผ่านเกณฑ์ CLE / Failed CLE (Tier 1)' : 'รอตรวจสอบ / Under Review (Tier 2)'}</span>
            </div>
            <p style="color:var(--muted);margin-bottom:16px">ผลเกณฑ์ทั้ง 6 ข้อ / 6 Criteria:</p>
            ${criteria.map(c => `
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;color:${ple[c+'_pass'] ? 'var(--success-text)' : 'var(--error-text)'}">
                ${icon(ple[c + '_pass'] ? 'checkCircle' : 'xCircle', 18)}
                <span style="color:var(--body-color)">${CRITERIA_LABELS[c]}</span>
              </div>`).join('')}
            <a href="/dashboard" class="btn btn-ghost" style="display:inline-block;margin-top:16px">← กลับ</a>
          </div>`;
        return;
      }

      if (ple.status === 'cle_pass') {
        container.innerHTML = `
          <div class="card" style="text-align:center">
            <div class="status-band is-pass" style="justify-content:center;margin-bottom:14px">${icon('checkCircle', 28)}<span>ผ่านเกณฑ์ CLE แล้ว / CLE Passed</span></div>
            <p style="color:var(--muted);margin-top:8px">กำลังประเมินผล PIS-7 อยู่… / Evaluating PIS-7…</p>
          </div>`;
        schedulePoll();
        return;
      }

      const eval_ = await api.getEvaluation(pleId);
      if (!eval_ || eval_.status) {
        container.innerHTML = `<div class="card" style="text-align:center"><p style="color:var(--muted)">กำลังประเมิน… / Evaluating…</p></div>`;
        schedulePoll();
        return;
      }
      // Error envelope or malformed evaluation — never render a NaN scorecard.
      if (eval_.error || typeof eval_.composite_score !== 'number') { showMissing(container); return; }
      clearTimeout(pollTimer);

      const scores = [eval_.d1,eval_.d2,eval_.d3,eval_.d4,eval_.d5,eval_.d6,eval_.d7];
      container.innerHTML = `
        <div class="card" style="text-align:center;margin-bottom:16px">
          <p style="font-family:var(--font-display);font-size:64px;font-weight:600;line-height:1;color:var(--coral)">${Math.round(eval_.composite_score)}</p>
          <p style="color:var(--muted)">คะแนน PIS-7 / 100</p>
          <div class="badge badge-evaluated" style="margin-top:10px;display:inline-flex;align-items:center;gap:5px">${icon('checkCircle', 14)} ได้รับ CPD Credit</div>
        </div>
        <div class="card"><canvas id="radarChart" height="260"></canvas></div>
        <div class="card">
          <h3 style="margin-bottom:12px">ผลรายโดเมน / Domain Scores</h3>
          ${DOMAIN_LABELS.map((label, i) => `
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                <span style="font-size:13px">${label}</span>
                <strong>${scores[i]}/5</strong>
              </div>
              <div style="background:var(--surface-card);border-radius:4px;height:6px">
                <div style="background:var(--coral);height:6px;border-radius:4px;width:${scores[i]/5*100}%"></div>
              </div>
              <p style="font-size:13px;color:var(--muted);margin-top:4px">${eval_.domain_rationale?.['d'+(i+1)] ?? ''}</p>
            </div>`).join('')}
        </div>`;

      lastScores = scores;
      buildRadar();
    }
    window.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
