name: Backend container

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual Railway image (no secrets)
        run: docker build --platform linux/amd64 -t clics-backend:test backend
      - name: Entrypoint starts Node without Tailscale
        run: |
          docker run --rm --network none clics-backend:test node -e '
            const assert = require("node:assert/strict");
            assert.equal(process.env.NODE_ENV, "production");
            assert.equal(typeof require("undici").ProxyAgent, "function");
            require("./src/services/rimpl-client");
            console.log("Backend runtime ready:", process.version);
          '
      - name: An unavailable tailnet cannot prevent the application command from starting
        run: |
          timeout 45s docker run --rm --network none \
            -e TS_AUTHKEY=synthetic-invalid-key -e TS_UP_TIMEOUT=1s \
            clics-backend:test node -e 'console.log("Application command started despite offline tailnet")'
