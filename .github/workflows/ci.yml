name: CI

# Hermetic test pipeline — every suite mocks Supabase + the Anthropic SDK, so they run with NO real
# secrets and no live infrastructure: backend (jest), audit-dashboard (jest), license-verifier
# (node --test), and all 8 rimpl suites. See docs/TESTING.md.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fully-hermetic suites (jest for backend, node --test for license-verifier) — no env needed.
  # backend enforces coverage thresholds (jest.config.js) via --coverage.
  test:
    name: test (${{ matrix.layer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: backend
            cmd: npm test -- --coverage
          - layer: license-verifier
            cmd: npm test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.layer }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.layer }}
      - run: ${{ matrix.cmd }}
        working-directory: ${{ matrix.layer }}

  # rimpl: all 8 suites are hermetic — Supabase + the Anthropic SDK are jest.mock'd (incl. the PII
  # boundary + adversarial-leak suites), so no env is needed. test:ci == test (jest --runInBand).
  rimpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rimpl/package-lock.json
      - run: npm ci
        working-directory: rimpl
      - run: npm run test:ci -- --coverage
        working-directory: rimpl

  # Next.js dashboard: typecheck + jest (with coverage thresholds) + lint — all blocking.
  audit-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-dashboard/package-lock.json
      - run: npm ci
        working-directory: audit-dashboard
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: audit-dashboard
      - name: Unit tests (jest, coverage thresholds)
        run: npm test -- --coverage
        working-directory: audit-dashboard
      - name: Lint
        run: npm run lint
        working-directory: audit-dashboard

  # Static portal has no build step — gate on JS syntax.
  physician-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JS
        run: for f in public/js/*.js; do node --check "$f"; done
        working-directory: physician-ui

  # Probe scripts decide the D18 local-model gate verdict, and until 2026-09-04 CI did not touch them at
  # all — no test, no lint, not even a syntax check. That is how one accounting bug was fixed in
  # repeat-consistency.mjs and then written again, independently, in screening-verdict.mjs and
  # e2-compare.mjs, where it produced three different wrong answers about the same run in a single day.
  # The scripts themselves need a live box and secrets; their PURE logic does not, and that is what runs
  # here. Anything decision-bearing extracted from them belongs in a *.test.mjs beside it.
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check probe scripts
        run: for f in scripts/probe/*.mjs; do node --check "$f"; done
      - name: Pure-logic tests
        run: node --test scripts/probe/*.test.mjs

  # Tutor-reply quality harness (docs/QUALITY-GATES.md). Like the probe job: the scripts need a live
  # box, but the bank validation, the deterministic checks, citation classification, packet blinding
  # and the kappa/Wilson math do not — and they decide a go/no-go, so they are tested offline here.
  # No npm install: scripts/quality must load rimpl's production modules without a single package.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check quality scripts
        run: for f in scripts/quality/*.mjs; do node --check "$f"; done
      - name: Offline tests (bank, checks, citations, judging, clinician export)
        run: node --test scripts/quality/*.test.mjs

  # vm1 (Topology B, docs/adr/0002-vm1-topology-b.md): the compose project, both images, the nginx site
  # and deploy.sh. Nobody has Docker on the Mac these are written on, so THIS is where the images are
  # proven to build and the hardened containers (read-only, non-root, no capabilities) proven to boot.
  # Hermetic: the env files are dummies generated from the committed examples, every host in them is
  # *.invalid, and nothing is pushed anywhere. Production stays on Railway; this deploys nothing.
  deploy-vm1:
    runs-on: ubuntu-latest
    env:
      CLICS_RELEASE: ci
      CLICS_UID: '10001'
      CLICS_GID: '10001'
      COMPOSE_FILE: deploy/vm1/docker-compose.yml
      # Job-level, not written to GITHUB_ENV by a step: the always()/failure() steps below interpolate the
      # compose file too, and must still resolve it when an earlier step failed.
      CLICS_ENV_DIR: /tmp/clics-env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First, so every later step (including Container logs / Tear down) finds the env files.
      - name: Dummy env files from the examples
        run: node scripts/deploy/vm1-ci-env.mjs "$CLICS_ENV_DIR"
      # The remote steps are linted exactly as deploy.sh sends them: remote/lib.sh + remote/<step>.sh
      # (activate is the script staged on vm1 and started detached by launch).
      - name: Script syntax + shellcheck
        run: |
          bash -n deploy/vm1/deploy.sh
          shellcheck deploy/vm1/deploy.sh
          for step in preflight activate launch attach; do
            cat deploy/vm1/remote/lib.sh "deploy/vm1/remote/$step.sh" | bash -n
            cat deploy/vm1/remote/lib.sh "deploy/vm1/remote/$step.sh" | shellcheck -s bash -
          done
          node --check deploy/vm1/health-gate.cjs
      # With docker present, vm1.test.mjs also checks the compose file as docker renders it.
      - name: Guard tests (loopback-only backend, unpublished rimpl, no backend/Dockerfile, no IPs, deploy.sh, remote steps)
        run: node --test scripts/deploy/*.test.mjs
      - name: Compose renders
        run: docker compose config -q
      - name: Build both images
        run: docker compose build
      - name: Boot the hardened containers
        run: docker compose up -d --wait --wait-timeout 120
      - name: Loopback binding, no rimpl port, non-root, read-only, and the deploy gate's mechanics
        run: |
          set -euo pipefail
          curl -fsS --max-time 5 http://127.0.0.1:3101/health
          [ "$(docker compose port backend 3001)" = "127.0.0.1:3101" ]
          # rimpl must have NO host binding. Not `docker compose port`: for a port the image EXPOSEs but
          # compose does not publish, it prints ":0", which looks like output. Read the bindings instead.
          rimpl_id="$(docker compose ps -q rimpl)"
          bound="$(docker inspect -f '{{range $p, $v := .NetworkSettings.Ports}}{{if $v}}{{$p}} {{end}}{{end}}' "$rimpl_id")"
          [ -z "$bound" ] || { echo "::error::rimpl publishes host ports: $bound"; exit 1; }
          [ "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$rimpl_id")" = 0 ] \
            || { echo "::error::rimpl has port bindings"; exit 1; }
          [ "$(docker compose exec -T backend id -u)" = 10001 ]
          [ "$(docker compose exec -T rimpl id -u)" = 10001 ]
          # Read-only root filesystem, both services. Docker's own flag first. Then a write that only a
          # read-only root can refuse: /var/tmp is world-writable (1777) in both images, so the non-root
          # uid could write it on a writable root. (/app would refuse on permissions alone, proving
          # nothing.) The same write to the tmpfs /tmp must succeed, which proves the probe itself works.
          for svc in backend rimpl; do
            [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q "$svc")")" = true ] \
              || { echo "::error::$svc does not run with a read-only root filesystem"; exit 1; }
            docker compose exec -T "$svc" sh -c 'touch /tmp/probe' || { echo "::error::$svc cannot write its tmpfs /tmp"; exit 1; }
            if docker compose exec -T "$svc" sh -c 'touch /var/tmp/probe' 2>/dev/null; then echo "::error::$svc root filesystem is writable"; exit 1; fi
          done
          docker compose exec -T backend node -e "fetch('http://rimpl:3003/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
          # deploy.sh's rimpl gate, run exactly as on vm1. With a dummy Supabase rimpl answers 503, so the
          # gate must exit 2: it reached rimpl, rimpl ACCEPTED the token on GET /manifest (asked even when
          # /health/deep is 503), and rimpl is degraded. Not 3 (token refused), 6 (unreachable) or 64.
          set +e
          docker compose run --rm --no-deps -T -v "$PWD/deploy/vm1/health-gate.cjs:/gate.cjs:ro" backend node /gate.cjs rimpl
          code=$?
          set -e
          [ "$code" = 2 ] || { echo "::error::rimpl gate exited $code, expected 2"; exit 1; }
      - name: nginx site parses (nginx 1.18, as Ubuntu 20.04 ships)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/nginx"; mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=clics.ccme.or.th' \
            -keyout "$d/privkey.pem" -out "$d/fullchain.pem" 2>/dev/null
          sed 's#/PLACEHOLDER/cme-cert-manager/clics.ccme.or.th/#/etc/nginx/test-cert/#' \
            deploy/vm1/nginx/clics.ccme.or.th.conf > "$d/clics.conf"
          docker run --rm -v "$d/clics.conf:/etc/nginx/conf.d/clics.conf:ro" \
            -v "$d:/etc/nginx/test-cert:ro" nginx:1.18 nginx -t
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # The model manifest (CCME R2): rimpl/src/model-manifest.json is GENERATED from the code
  # (scripts/manifest/build.mjs) and committed. --check regenerates it and fails if the committed copy
  # differs — a prompt, rubric, decoding default, router rule or provider-policy edit that did not
  # regenerate it would otherwise ship a manifest describing a different instrument from the one that
  # runs. `env -i`: the output must depend on the code alone, never on what the runner exports.
  # No npm install, like the probe and quality jobs: lib/manifest.js and everything it loads are
  # package-free, and this job is what proves it.
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check manifest scripts
        run: for f in scripts/manifest/*.mjs; do node --check "$f"; done
      - name: Canonicalisation and check-mode tests
        run: node --test scripts/manifest/*.test.mjs
      - name: The committed manifest is what the code generates (scrubbed env)
        run: env -i PATH="$PATH" node scripts/manifest/build.mjs --check

  # The hash-chained, append-only audit_log (db/migration-audit-log-chain.sql) lives in TRIGGERS, which
  # the jest suites mock away. This runs the migration against a real, throwaway PostgreSQL — the one
  # preinstalled on the runner, started by the script itself in a temp dir — and asserts concurrency,
  # refusals, spoofing, grants and tamper detection. Touches no shared database.
  audit-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tamper tests against a throwaway PostgreSQL
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" scripts/db/audit-chain-tamper-test.sh

  # store_chat_turn() with the chat router's trailing params (db/migration-chat-turn-flags.sql) is SQL the
  # jest suites only model. This applies the migration twice to a real, throwaway PostgreSQL on top of its
  # prerequisites and asserts: one function, unchanged security/grants, old-shape calls still resolve, the
  # flags + superseded draft land on the assistant row, the widened CHECK, and the CT409 / 23505 refusals.
  chat-turn-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: store_chat_turn + middleware_flags against a throwaway PostgreSQL
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" scripts/db/chat-turn-flags-test.sh

  # The Model Lock's manifest columns (db/migration-evaluator-lock-manifest.sql) are DDL the jest suites
  # only mock. This applies it to a real, throwaway PostgreSQL: refused before its prerequisite, applied
  # with and without shadow_evaluations, twice; grants, RLS and the deny-all policy unchanged; the CHECKs
  # refuse a malformed sha or a half-written pair; and db/schema.sql declares the same table.
  evaluator-lock-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: evaluator_model_lock manifest columns against a throwaway PostgreSQL
        run: PG_BIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" scripts/db/evaluator-lock-manifest-test.sh

  # Calibration — three-way.js decides G0.5, the programme's go/no-go. Its output is a number an
  # operator writes into a protocol document, so a plausible-but-wrong figure is far worse here than
  # a crash. The same SCOPE-LEAK defect (a `--manifest` filter narrowing a set a later consumer still
  # read under a broader meaning) shipped into it twice and was caught by human review both times,
  # never by a test -- once flipping the contract gate FAIL 50% -> PASS 100% on the same database.
  # The suite runs the real script against a fixture DB through a stubbed supabase client: no
  # network, no paid API, no writes into the committed runs/.
  # The same job runs the anchor-cohort suite (scripts/calibration/anchors/anchors.test.mjs): the design
  # matrix must regenerate byte-for-byte from its seed, every committed synthetic fixture must pass
  # schema / blindness / pii-filter / citation-allowlist checks, and manifest.json must match the files.
  # And the SANDBOX import planner (anchors/sandbox-import.test.mjs): fixture -> ples/messages/reflection
  # rows, held-out sha refusal, non-SANDBOX council refusal, median-of-K shadow rows — dry-run only.
  # Package-free like the rest of this job.
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The anchor suite compares HELDOUT-LOCK.json with master's copy: a held-out fixture locked on
      # master may never change. A depth-1 checkout has no origin/master, and under CI the test FAILS
      # without it rather than skipping, so fetch master explicitly.
      - name: Fetch origin/master for the held-out lock check
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scope-leak regression suite + anchor cohort checks
        run: npm run test:calibration

  # Manuals — the physician + auditor guides are GENERATED from docs/manuals/content/*.md into
  # physician-ui/public/manual.html and audit-dashboard/lib/manual-content.ts, both committed. This
  # job is the reason that can be trusted:
  #   * --check fails if a generated file (or a copied screenshot) is behind its source, so the
  #     committed copy can never drift from the markdown;
  #   * verify-labels greps every UI label the manual quotes VERBATIM against the real front-end
  #     source, so a renamed button turns the manual red instead of quietly lying to a physician;
  #   * prose-audit compares the Thai and English halves — block shape, callout SEVERITY and
  #     terminology. A `warn` translated as a `note` is a severity change no reader can see and no
  #     rendering gate can catch, and it is the likeliest defect in a bilingual document.
  # That second check is the one that matters: the three print guides this replaces went two months
  # stale with no signal at all, because prose drift breaks nothing that anyone was measuring.
  # Needs no secrets and no live infra, but it is NOT browserless: the type-scale gate installs
  # Chromium, BUILDS AND SERVES the dashboard, and renders BOTH manuals at 11 widths.
  manuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Two `npm ci` runs (root for playwright, audit-dashboard for the build the scale gate
          # serves), so cache ~/.npm against both lockfiles.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            audit-dashboard/package-lock.json
      - name: Parser tests, freshness, label drift, and TH/EN prose parity
        run: npm run test:manuals
      # `npx playwright install` downloads the BROWSER; it does not create node_modules, and the
      # scale gate does `import { chromium } from 'playwright'`. Without this the step dies with
      # ERR_MODULE_NOT_FOUND before measuring anything. The sibling `responsive` job does the same.
      - run: npm ci
      - name: Install Chromium for the type-scale gate
        run: npx playwright install --with-deps chromium

      # ---- the dashboard half of the gate needs the manual SERVED ------------------------------
      # /manual builds as `○ (Static)`: a prerender of the committed lib/manual-content.ts, with no
      # auth guard (deliberate — see app/manual/page.tsx), no backend call and no request-time
      # fetch. NavBar returns null signed-out and the page carries its own back link, so it renders
      # in full with zero secrets. `next build`, not `next dev`: dev CSS is not what ships, and the
      # gate navigates with waitUntil:'networkidle', which a dev server's HMR socket never settles.
      - name: Install dashboard deps
        run: npm ci
        working-directory: audit-dashboard
      - name: Build the dashboard (no secrets)
        run: npm run build
        working-directory: audit-dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Baked into the client bundle at build time. /manual never calls it; pin it to dead
          # loopback so no CI build can ever point a rendered page at prod.
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      - name: Serve the dashboard on :3002
        working-directory: audit-dashboard
        run: |
          # The real binary, not `npx` — the readiness check below liveness-tests this PID, and npx
          # would hand it the wrapper's. Both streams go to a file so the step cannot hang on the
          # child holding the runner's stdout open.
          ./node_modules/.bin/next start -p 3002 > "$RUNNER_TEMP/dash.log" 2>&1 &
          echo "DASH_PID=$!" >> "$GITHUB_ENV"
      # Readiness, not a sleep: poll the exact URL the gate will open and require the manual's own
      # markup in the body, so a 200 error shell cannot satisfy it. Bails the moment the server
      # dies instead of burning the whole budget, and prints the server log either way.
      - name: Wait for /manual to serve
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3002/manual | grep -q 'data-role="body"'; then
              echo "dashboard ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$DASH_PID" 2>/dev/null; then
              echo "::error::next start exited before serving /manual"
              cat "$RUNNER_TEMP/dash.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::/manual did not become ready within 60s"
          cat "$RUNNER_TEMP/dash.log"
          exit 1
      # The manual renders in two consoles that scale desktop type incompatibly (physician-ui
      # scales `body`, audit-dashboard scales `html`), so any px size is frozen while the base
      # grows. This measures every text role against the role whose scale governs it, at 11 widths,
      # in both languages, in BOTH consoles, and fails on inversion — the defect it was written for
      # was h3 rendering 17px inside 22px body at 1280px, which every other gate passed.
      # REQUIRE_DASH makes a missing DASH_URL a failure: without it a typo'd variable name silently
      # re-runs the portal-only half and reports green, which is the exact hole this closes.
      - name: Type-scale hierarchy across viewports (portal + dashboard)
        env:
          DASH_URL: http://127.0.0.1:3002
          REQUIRE_DASH: '1'
        run: npm run test:manuals-scale
      - name: Stop the dashboard server
        if: always()
        run: kill "$DASH_PID" 2>/dev/null || true

  # Responsive regression guard — renders the static physician-ui portal at 320/375/768/1280 under
  # coarse-pointer emulation and asserts 0 horizontal overflow, ≥44px touch targets, and ≥16px form
  # fields (iOS no-zoom). Hermetic: a built-in static server serves the pages and all external
  # requests (fonts / Chart.js CDN / backend) are aborted, so it needs no secrets or live infra.
  # Also runs the fuller mobile-audit harness: physician-ui hermetic (always, no secrets) PLUS a
  # dashboard auditor-only live-smoke on pushes to master when its secrets are set. Pull requests
  # always stay hermetic, including branches in this repository. Superadmin smoke is omitted (no
  # SUPER_* secrets) to keep real admin creds out of CI.
  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive smoke (320/375/768/1280)
        run: npm run test:responsive
      # /ple-chat with 30 messages at 320/375/390: the page never scrolls past the composer, and with a
      # keyboard up the composer and the one-line AI notice stay on screen. Hermetic, ~10 s.
      - name: Chat page-scroll guard (320x568 / 375x667 / 390x844)
        run: npm run test:chat-scroll
      # /ple-chat lost-connection settle (#141 client_turn_id + the one-bubble rules). Hermetic, fake clock.
      - name: Chat turn-settle smoke
        run: npm run test:chat-settle
      # Mobile audit: physician-ui hermetic (always) + dashboard auditor live-smoke only on master
      # pushes. Same-repository PRs otherwise inherit the production secrets too. The harness
      # exits non-zero on any finding. SUPER_* deliberately unset → no real admin creds in CI.
      - name: Mobile audit (physician-ui hermetic + dashboard auditor live-smoke)
        env:
          DASH_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.DASH_URL || '' }}
          BACKEND_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.BACKEND_URL || '' }}
          AUDITOR_EMAIL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.AUDITOR_EMAIL || '' }}
          AUDITOR_PW: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.AUDITOR_PW || '' }}
        run: npm run test:mobile-audit
