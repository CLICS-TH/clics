name: CI

# Hermetic test pipeline — backend + license-verifier + rimpl's logic suites mock Supabase + the
# Anthropic SDK, so they run with NO real secrets and no live infrastructure. rimpl's 3 INTEGRATION
# suites (chat, rag-pii, evaluate-validation) need a live Supabase and are excluded here (run via the
# live gate — see docs/TESTING.md); the rimpl job passes dummy placeholder env only so the Supabase
# client can construct at import.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fully-hermetic suites (jest for backend, node --test for license-verifier) — no env needed.
  test:
    name: test (${{ matrix.layer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [backend, license-verifier]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.layer }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.layer }}
      - run: npm test
        working-directory: ${{ matrix.layer }}

  # rimpl: the hermetic logic suites (pii-filter, pii-leak-adversarial, post-filter, transcript-fence,
  # claude). Dummy placeholder env lets src/lib/supabase construct the client at import (no real calls).
  rimpl:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
      INTERNAL_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rimpl/package-lock.json
      - run: npm ci
        working-directory: rimpl
      - run: npm run test:ci
        working-directory: rimpl

  # Next.js dashboard: typecheck is the blocking gate; lint is informational (pre-existing findings).
  audit-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit-dashboard/package-lock.json
      - run: npm ci
        working-directory: audit-dashboard
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: audit-dashboard
      - name: Lint (informational)
        run: npm run lint
        working-directory: audit-dashboard
        continue-on-error: true

  # Static portal has no build step — gate on JS syntax.
  physician-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JS
        run: for f in public/js/*.js; do node --check "$f"; done
        working-directory: physician-ui
