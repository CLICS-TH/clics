# deploy/data-host/postgresql.conf: the CLICS data host's settings (ADR 0012, #432). setup.sh copies it to
# /srv/clics-data/conf (inside the LUKS volume); the container reads it as /etc/clics/postgresql.conf.
# Everything not set here is PostgreSQL 18's default.

data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/clics/pg_hba.conf'

# The port is published only on the tailnet address (docker-compose.yml); inside the container it listens
# on every interface so that published port reaches it.
listen_addresses = '*'
port = 5432
max_connections = 50

# TLS on every network connection: pg_hba.conf has hostssl lines only. The CA and server certificate are
# made by `setup.sh tls`; vm1 checks them with sslmode=verify-full.
ssl = on
ssl_cert_file = '/etc/clics/server.crt'
ssl_key_file = '/etc/clics/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# Enough to answer "who connected, from where, and was it refused" without logging any row or statement.
# The log goes to stderr, so into Docker's log on cme-dev's plain disk, outside the LUKS volume: nothing
# that can carry a value may reach it. A query's ERROR (its message can quote an input value, its DETAIL
# a whole row: a duplicate invite's email) is not logged at all; the app receives every error anyway.
# LOG and FATAL stay: connections, refusals, failed passwords, checkpoints, start and stop.
log_destination = 'stderr'
log_min_messages = 'log'
log_error_verbosity = 'terse'
log_min_error_statement = 'panic'
log_connections = 'receipt,authentication,authorization'
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %r '
log_statement = 'none'

shared_buffers = '256MB'
