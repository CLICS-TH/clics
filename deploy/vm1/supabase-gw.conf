# The internal gateway in docker-compose.auth.yml. supabase-js builds every URL from one SUPABASE_URL
# (<url>/auth/v1, <url>/rest/v1), so the backend and rimpl get http://supabase-gw:8080 and this file splits
# the paths. It publishes no port: only containers on the `clics` network reach it (PostgREST, ADR 0007).
# The public face of GoTrue is the host's nginx at /auth/v1 (nginx/clics.ccme.or.th.conf), not this file.
server {
    listen 8080;
    server_name _;

    # nginx's default 1 MiB would refuse a large PostgREST write; Supabase's own gateway sets no cap here.
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;

    location /auth/v1/ {
        proxy_pass http://gotrue:9999/;
    }

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
    }

    # GoTrue's mail templates (docker-compose.auth.yml), fetched by GoTrue when it sends a mail.
    location /templates/ {
        alias /srv/auth-templates/;
    }

    location / {
        return 404;
    }
}
