# The Portal's own nginx, inside the clics-portal container (deploy/vm1/portal.Dockerfile). It replaces
# physician-ui/vercel.json on vm1: the same clean URLs, cle-* redirects and headers. The host nginx
# (nginx/clics.ccme.or.th.conf) proxies / here; TLS and HSTS stay there.
#
# The whole main config, not a conf.d snippet: the container runs read-only as the host's clics uid, so
# every path nginx writes (pid, temp files) is under the /tmp tmpfs.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The host nginx logs every request with the query string removed; a second log here would keep it.
    access_log off;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Redirects are relative, so they keep the public https://clics.ccme.or.th origin the host nginx
        # was reached on rather than naming this container's port.
        absolute_redirect off;

        # vercel.json "headers" for every path. add_header in a location replaces these, so /fonts/
        # repeats them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        # vercel.json "redirects": the pre-rename CLE paths, temporary (302) as there.
        location ~ ^/cle-(chat|new|reflect|result)(\.html)?$ {
            return 302 /ple-$1$is_args$args;
        }

        # cleanUrls: /x.html redirects to /x (Vercel answers 308), and /index.html to /.
        location = /index.html {
            return 308 /$is_args$args;
        }
        # The redirect is relative (absolute_redirect off), so its target must be a path that cannot name
        # another host. $uri is decoded: /%5Cevil.com.html would redirect to /\evil.com and /%09/evil.com.html
        # to /<tab>/evil.com, both of which a browser resolves to https://evil.com/. So the target is built
        # only from non-empty segments of unreserved characters, each after exactly one slash. Any other
        # .html path is not redirected: it falls through to location / and answers 404 (no file has such a
        # name). scripts/deploy/vm1.test.mjs checks every 3xx here against hostile paths.
        location ~ ^(?<clean>(/[A-Za-z0-9._~-]+)+)\.html$ {
            return 308 $clean$is_args$args;
        }

        location /fonts/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # cleanUrls: /x serves x.html, / serves index.html.
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
