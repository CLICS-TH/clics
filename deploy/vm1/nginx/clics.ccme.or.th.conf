# nginx site for the CLICS API on vm1 (Topology B, docs/adr/0002-vm1-topology-b.md).
#
# INSTALLED BY THE CME TEAM, not by deploy.sh: vm1's nginx also serves ccme.or.th, headscale.ccme.or.th
# and score.ccme.or.th, and a broken reload would take those down too. The ask (deploy/vm1/README.md):
#   1. DNS A record clics.ccme.or.th -> vm1's public IPv4.
#   2. A certificate for clics.ccme.or.th from the CME cert-manager runner, written to the two paths
#      marked PLACEHOLDER below.
#   3. Copy this file to /etc/nginx/sites-available/, symlink it into sites-enabled/, `nginx -t`, reload.
#
# Two upstreams: the backend's loopback port, and GoTrue's at /auth/v1 only. rimpl, PostgREST and the internal
# supabase-gw have no host port and are never proxied (R4, ADR 0007).

upstream clics_backend {
    # Must equal the loopback port in deploy/vm1/docker-compose.yml (scripts/deploy/vm1.test.mjs checks).
    server 127.0.0.1:3101;
    keepalive 16;
}

# Self-hosted GoTrue (#427): its loopback port in deploy/vm1/docker-compose.auth.yml (the guard test checks
# they agree). Until the database move (#432) starts it on this host, /auth/v1 answers 502.
upstream clics_gotrue {
    server 127.0.0.1:3102;
    keepalive 8;
}

# HTTP -> HTTPS. If the cert-manager runner proves the domain with an HTTP-01 challenge, CME adds its
# challenge location here; with DNS-01 nothing else is needed.
server {
    listen 80;
    server_name clics.ccme.or.th;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/1.1 only, deliberately: no `http2`. On nginx before 1.25.1 (Ubuntu 20.04 ships 1.18) http2 is
    # a flag on the listening socket, not on this server block: nginx merges it across every server on
    # the same address:port. `listen 443 ssl http2` here would turn HTTP/2 on for the other sites vm1
    # serves on 443 (ccme.or.th, headscale, score), which are not ours to change. `http2 on;`, the
    # per-server form, does not exist before 1.25.1. The API needs nothing from HTTP/2: the chat stream
    # is plain SSE over HTTP/1.1. IPv6 is left out: only an A record is requested.
    listen 443 ssl;
    server_name clics.ccme.or.th;

    # PLACEHOLDERS: the CME cert-manager runner fills these in. `nginx -t` fails until it does, which is
    # the point: this site must not be enabled without its own certificate.
    ssl_certificate     /PLACEHOLDER/cme-cert-manager/clics.ccme.or.th/fullchain.pem;
    ssl_certificate_key /PLACEHOLDER/cme-cert-manager/clics.ccme.or.th/privkey.pem;

    # HSTS from nginx, so it also covers nginx's own error pages. The backend's helmet sends its own;
    # it is hidden so the response carries one header, not two.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Equal to the backend's own cap, express.json({ limit: '1mb' }) at backend/src/index.js:55 (both
    # are 1 MiB). The API takes JSON bodies only; there is no upload route.
    client_max_body_size 1m;

    access_log /var/log/nginx/clics.access.log;
    error_log  /var/log/nginx/clics.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend trusts exactly ONE proxy hop (app.set('trust proxy', 1), backend/src/index.js:34) and
    # reads the client address as the right-most X-Forwarded-For entry, which is the one appended here.
    # Docker's loopback port publish is TCP-level and adds no hop. If anything (CDN, load balancer) is
    # ever put in front of this nginx, that changes: see deploy/vm1/README.md, "trust proxy".
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Long requests are normal here, and nothing is sent while they run:
    #   * a chat turn waits up to RIMPL_CHAT_TIMEOUT_MS (100 s; 150 s on the local-model stack) before
    #     its first byte;
    #   * POST /ples/:id/end waits for tier-2 screening, up to 3 attempts x RIMPL_CRITERIA_TIMEOUT_MS
    #     (180 s) plus backoff (backend/src/services/ple-finalize.js:18-28), about 9 minutes worst case.
    # proxy_read_timeout is the gap allowed between two reads, so it must cover the whole silence.
    proxy_connect_timeout 5s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # The streamed chat turn (server-sent events), POST /ples/:id/message. The backend already sends
    # `X-Accel-Buffering: no` on the stream (backend/src/lib/sse.js:30), which nginx honours; buffering,
    # caching and gzip are also switched off here so the route stays streamed whatever the server-wide
    # defaults on this shared nginx are. Buffering stays on elsewhere, so a slow client downloading an
    # XLSX export does not hold a backend connection open.
    location ~ ^/ples/[^/]+/message$ {
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_pass http://clics_backend;
    }

    # GoTrue, the browser's sign-in API (ADR 0012). The prefix is stripped: GoTrue serves /token, /user,
    # /authorize, /callback, /verify and /logout at its root, which is all the Portal and the dashboard call.
    # The admin API, and the mail-sending endpoints only the backend calls (signup is closed in the backend;
    # /otp and /recover go through its rate-limited routes), are reached through supabase-gw on the docker network
    # and are not published here. A regex location, so it is checked after the prefix below and wins.
    location ~ ^/auth/v1/(admin|signup|otp|recover|magiclink|invite|resend|reauthenticate)(/|$) {
        return 404;
    }
    location /auth/v1/ {
        proxy_read_timeout 60s;
        proxy_pass http://clics_gotrue/;
    }

    location / {
        proxy_pass http://clics_backend;
    }
}
