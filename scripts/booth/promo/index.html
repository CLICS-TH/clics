<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/capture/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Noto Sans Thai'; src: url('assets/capture/noto-sans-thai-thai-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('assets/capture/cormorant-garamond-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
      :root {
        --canvas: #faf9f5;
        --ink: #141413;
        --body: #3d3d3a;
        --accent: #a9583e;
        --band: #efe9de;
        --hairline: #e6dfd8;
        --on-ink: #faf9f5;
        --on-ink-soft: #d9d4c9;
        --font-sans: 'Inter', 'Noto Sans Thai', sans-serif;
        --font-serif: 'Cormorant Garamond', serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-sans); color: var(--ink); }
      .ground { position: absolute; inset: 0; background: var(--canvas); }
      .ground.ink { background: var(--ink); }
      .ground.accent { background: var(--accent); }
      /* Kinetic lines: each line is one unbroken Thai phrase (nowrap), revealed by sliding up inside its mask.
         The mask pads above and below so Thai upper vowels, tone marks and lower vowels are never clipped. */
      .ln { display: block; overflow: hidden; padding: 0.14em 0 0.1em; margin: -0.14em 0 -0.1em; white-space: nowrap; }
      .ln > span { display: inline-block; }
      /* The step header: a numbered disc and a two-line bilingual title, top of the title-safe box. */
      .step { position: absolute; left: 108px; right: 108px; top: 200px; display: flex; align-items: center; gap: 40px; }
      .step .num { flex: none; width: 168px; height: 168px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 104px; font-weight: 800; line-height: 1; }
      .step .th { font-size: 112px; line-height: 1.3; font-weight: 800; }
      .step .en { font-size: 52px; line-height: 1.25; font-weight: 600; color: var(--body); }
      .on-ink .step .th { color: var(--on-ink); }
      .on-ink .step .en { color: var(--on-ink-soft); }
      .demo { position: absolute; left: 60px; right: 60px; bottom: 150px; padding: 30px 40px 34px; border-radius: 28px; background: var(--band); border: 2px solid var(--hairline); }
      .demo .th { white-space: nowrap; font-size: 38px; line-height: 1.5; font-weight: 600; color: var(--ink); }
      .demo .en { font-size: 36px; line-height: 1.3; font-weight: 500; color: var(--body); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="try" data-composition-id="try" data-composition-src="compositions/try.html" data-start="4" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="draw" data-composition-id="draw" data-composition-src="compositions/draw.html" data-start="6.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="steps" data-composition-id="steps" data-composition-src="compositions/steps.html" data-start="10" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html" data-start="14.5" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="keep" data-composition-id="keep" data-composition-src="compositions/keep.html" data-start="18.5" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="21" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <audio id="bgm" class="clip" src="assets/music/bgm.m4a" data-start="0" data-duration="24" data-track-index="9" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
