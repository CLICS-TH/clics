<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Inter'; src: url('assets/capture/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Noto Sans Thai'; src: url('assets/capture/noto-sans-thai-thai-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Cormorant Garamond'; src: url('assets/capture/cormorant-garamond-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
      :root {
        --canvas: #faf9f5;
        --ink: #141413;
        --body: #3d3d3a;
        --accent: #a9583e;
        --band: #efe9de;
        --hairline: #e6dfd8;
        --font-sans: 'Inter', 'Noto Sans Thai', sans-serif;
        --font-serif: 'Cormorant Garamond', serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-sans); color: var(--ink); }
      .ground { position: absolute; inset: 0; background: var(--canvas); }
      .cap { position: absolute; left: 108px; right: 108px; top: 150px; height: 430px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
      .cap .th { font-size: 64px; line-height: 1.45; font-weight: 600; color: var(--ink); }
      .cap .en { font-size: 40px; line-height: 1.3; font-weight: 500; color: var(--body); }
      .card { position: absolute; left: 60px; top: 620px; width: 960px; height: 1240px; border-radius: 36px; overflow: hidden; background: #fff; border: 2px solid var(--hairline); box-shadow: 0 24px 60px rgba(20, 20, 19, 0.18); }
      .card .pan { position: absolute; left: 0; top: 0; width: 960px; }
      .card .pan img { display: block; width: 960px; height: auto; }
      .card .layer { position: absolute; inset: 0; }
      .demo { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 36px 26px; background: var(--band); border-top: 2px solid var(--hairline); }
      .demo .th { font-size: 32px; line-height: 1.45; font-weight: 600; color: var(--ink); }
      .demo .en { font-size: 30px; line-height: 1.3; font-weight: 500; color: var(--body); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="57" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="chat" data-composition-id="chat" data-composition-src="compositions/chat.html" data-start="5" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="score" data-composition-id="score" data-composition-src="compositions/score.html" data-start="12" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="audit" data-composition-id="audit" data-composition-src="compositions/audit.html" data-start="19" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="boothA" data-composition-id="boothA" data-composition-src="compositions/boothA.html" data-start="26" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="boothB" data-composition-id="boothB" data-composition-src="compositions/boothB.html" data-start="38" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="51" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
